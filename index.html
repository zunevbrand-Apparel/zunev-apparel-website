<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zunev Apparel | Wear Your Identity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        nav a {
            color: #111111;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: #f5f5f5;
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 76px);
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #555555;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #111111;
            color: white;
            padding: 15px 32px;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .collections {
            padding: 65px 8%;
            text-align: center;
        }

        .collections h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .collections p {
            color: #666666;
            line-height: 1.8;
        }

        footer {
            background: #111111;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 18px;
            }

            nav a {
                margin: 0 8px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZUNEV</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#collections">Collections</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <h1>WEAR YOUR IDENTITY.</h1>
            <p>Discover your style. Define your statement.</p>
            <a href="#collections" class="button">EXPLORE COLLECTIONS</a>
        </section>

        <section class="collections" id="collections">
            <h2>THE ZUNEV COLLECTION</h2>
            <p>
                Modern style. Timeless confidence.<br>
                Discover apparel designed to express who you are.
            </p>
        </section>
    </main>

    <footer id="contact">
        <p>&copy; 2026 Zunev Apparel. All rights reserved.</p>
    </footer>

</body>
</html>
